# Glossary — botanical and Hawaiian terms used in the field guide.
- term: Endemic
  definition: Native to Hawaiʻi and found nowhere else on Earth.
- term: Indigenous
  definition: Native to Hawaiʻi but also naturally occurring elsewhere (arrived without human help).
- term: Polynesian introduction (canoe plant)
  definition: Plants brought to Hawaiʻi by Polynesian voyagers before European contact.
- term: Modern introduction
  definition: Plants introduced to Hawaiʻi after European contact (post-1778).
- term: Invasive
  definition: A non-native species that spreads aggressively and displaces native flora or alters ecosystems.
- term: Strand
  definition: The zone of vegetated sand or coral rubble immediately above the high-tide line.
- term: Dune
  definition: Windblown sand deposits above the strand, often stabilized by low creeping vegetation.
- term: Sea cliff
  definition: Steep coastal rock face; on the Nā Pali coast these rise hundreds to thousands of feet and host several endemics found nowhere else.
- term: Valley mouth
  definition: The lower, wider end of a coastal valley where it meets the shore — a distinct habitat with freshwater influence.
- term: Riparian
  definition: Along the banks of streams; on this coast, the freshwater streams that spill onto Nā Pali beaches.
- term: Wahi pana
  definition: A storied or sacred place. The Nā Pali coast is wahi pana in its entirety.
- term: Kahakai
  definition: Beach or shoreline (Hawaiian).
- term: Pali
  definition: Cliff (Hawaiian). Nā Pali = "the cliffs."
- term: Obovate
  definition: Leaf shape shaped like an egg with the wider end away from the stem.
- term: Lanceolate
  definition: Leaf shape long and narrow, tapering to a point like a lance.
- term: Cordate
  definition: Heart-shaped leaf base.
- term: Palmate
  definition: Leaflets or lobes radiating from a common point, like fingers from a palm.
- term: Pinnate
  definition: Leaflets arranged in two rows along a central axis (like a feather).
- term: Entire margin
  definition: A leaf edge that is smooth, without teeth or lobes.
- term: Corymb
  definition: A flat- or round-topped flower cluster in which the outer flowers open first.
- term: Drupe
  definition: A fleshy fruit with a hard inner stone enclosing the seed (e.g., a cherry, or kou fruit).
- term: Rosette
  definition: A tight cluster of leaves arranged in a circle, usually near the ground or the top of a stem.
- term: Prostrate
  definition: Growing flat along the ground.
- term: Halophyte
  definition: A plant adapted to salty conditions — coastal strand plants are typically halophytes.
- term: Naupaka
  definition: The Hawaiian name for the genus Scaevola; on this coast usually refers to naupaka kahakai (Scaevola taccada).
- term: Kukui
  definition: Aleurites moluccanus, the state tree of Hawaiʻi; a Polynesian canoe plant of valley mouths.
- term: Milo, Kou, Hala
  definition: Indigenous coastal trees — milo (Thespesia populnea), kou (Cordia subcordata), hala (Pandanus tectorius).
- term: ʻĀlula
  definition: Brighamia insignis — the "cabbage on a stick," a Kauai Nā Pali cliff endemic listed as US Endangered.

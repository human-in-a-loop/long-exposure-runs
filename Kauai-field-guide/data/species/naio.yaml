taxonomic_notes: >-
  Family placement follows APG (Scrophulariaceae s.l.). Wagner, Herbst
  & Sohmer 1999 places *Myoporum* in the segregate family Myoporaceae;
  APG II onward merges Myoporaceae into a broadened Scrophulariaceae
  (with Buddleja and related genera). Both names refer to the same
  genus. Chinnock (2007) [B:4] is the monograph that still uses
  Myoporaceae. The species is unchanged.

slug: niu
scientific_name: Cocos nucifera
authority: L.
family: Arecaceae
common_names:
  hawaiian: [niu]
  english: [coconut palm, coconut]
status: polynesian_introduction
conservation_status: null
coastal_zones: [valley_mouth, strand]
tier: notable
occurrence_notes: >-
  Persistent groves at Kalalau, Honopū, Nuʻalolo Kai, and Miloliʻi
  valley mouths, plausibly deriving from pre-contact plantings by
  Hawaiian residents of those valleys prior to depopulation. Also
  scattered along back-beach strand where fallen nuts have taken root.
how_to_identify:
  growth_form: >-
    Unbranched palm with a single grey trunk, often curved by wind and
    light-seeking. Trunk marked with ring-shaped scars from fallen leaf
    bases. Crown a rosette of large fronds; no branching.
  leaves: >-
    Very large pinnate (feather-shaped) fronds, 4–6 m long, arching
    outward from the crown, each with many narrow leaflets.
  flowers: >-
    Small yellow-cream flowers on much-branched inflorescences (spadix)
    that emerge from among the fronds; usually only visible on closer
    inspection.
  fruit: >-
    The familiar coconut — a large ovoid drupe up to 30 cm, with a
    smooth green (or brown when dry) outer skin, a thick fibrous husk,
    and a hard woody inner shell. Green (young) fruits carry the sweet
    coconut water; brown fruits are fully mature.
  bark_stem: Pale grey, smooth, ringed with leaf-scar bands.
  size: 20–30 m tall at maturity.
  zone_hint: >-
    Valley mouths (persistent groves), back-beach strand, and cultural
    plantings behind the beach.
  clinchers:
    - Single unbranched grey ringed trunk — no other Kauaʻi coastal palm has this.
    - Large pinnate (feather) fronds, not palmate (fan) fronds.
    - Large hard-shelled fibrous-husked coconut fruit.
    - Persistent groves at Nā Pali valley mouths — habitat context.
  look_alikes:
    - species: Pritchardia spp. (loulu, native Hawaiian fan palms)
      how_to_distinguish: >-
        Loulu have palmate (fan-shaped) fronds — a completely different
        leaf architecture — and small round black-purple fruits, not
        the large coconut. Trunk is typically slimmer, unringed.
ecology: >-
  Pantropical strand palm with a buoyant, salt-tolerant, long-viable
  seed capable of ocean drift — a fact central to its biogeographic
  history and to the uncertainty note below. In Hawaiian coastal
  ecosystems niu provides shade, food (fallen fruit), and structure at
  valley mouths.
cultural_significance: >-
  Niu is a keystone canoe plant in Hawaiian tradition: food (young
  water and mature endosperm), cordage (senit twisted from husk fibre),
  thatching (fronds), containers (shells), oil, and wood — a complete
  provisioning tree. Kalalau, Miloliʻi, and Nuʻalolo Kai valleys still
  carry the physical memory of the families who tended these groves.
  This guide names those relationships without giving harvest or
  preparation technique; that transmission belongs to Hawaiian
  practitioners and lineal descendants of the valleys.
hazards: >-
  Falling coconuts and shed fronds cause serious injury and can be
  fatal. Do not linger under a bearing tree, do not tie a hammock or
  set a tent under a canopy that includes ripe fruit, and do not
  attempt to climb.
uncertainty: >-
  Biogeographic status is genuinely contested. This guide adopts the
  mainstream Hawaiian botanical treatment (Wagner, Herbst & Sohmer
  1999; NTBG) that lists niu among the canoe plants introduced by
  Polynesian voyagers. A minority position (Harries 1978, Botanical
  Review; and subsequent authors reviewing Pacific palaeoecological
  evidence) argues that the coconut's buoyant, salt-tolerant seed and
  documented long-distance ocean drift ecology make pre-Polynesian
  presence in the Pacific plausible. Both positions can be honoured:
  the mainstream Hawaiian treatment is followed here, and the
  alternative is noted. Field-guide users should be aware the
  scientific consensus is provisional and the ethnobotanical
  significance of niu as a canoe plant is not in dispute.

slug: sesuvium-portulacastrum
scientific_name: Sesuvium portulacastrum
authority: (L.) L.
family: Aizoaceae
common_names:
  hawaiian: [ʻākulikuli kai, ʻākulikuli]
  english: [sea purslane, shoreline seapurslane]
status: indigenous
conservation_status: null
coastal_zones: [strand]
tier: common
occurrence_notes: >-
  A prostrate succulent mat of saline back-beach flats, salt pans, and
  the upper strand where fresh water and salt water mix. On the
  roadless Kauaʻi coast it is most conspicuous behind sandy strand at
  Māhāʻulepū and on stabilized flats above the tideline at Kalalau and
  Miloliʻi; pantropical.
how_to_identify:
  growth_form: >-
    Long-lived prostrate succulent perennial forming dense mats to
    several metres across; branches root at nodes and radiate outward
    from a woody rootstock.
  leaves: >-
    Opposite, fleshy, oblong to lanceolate, 2–5 cm long, smooth and
    hairless. In sun-exposed plants the leaves and stems flush
    distinctly red-purple; in shaded plants they stay green.
  flowers: >-
    Solitary and axillary, pink to purple, star-shaped, 8–15 mm across,
    with 5 pointed lobes. What look like petals are actually coloured
    sepal lobes — the family Aizoaceae typically lacks true petals.
    Flowers open in bright sun.
  fruit: >-
    A small capsule opening by a circular lid (circumscissile), 4–5 mm,
    releasing tiny black seeds.
  bark_stem: >-
    Fleshy jointed stems, often flushed red; woody only at the extreme
    base of old plants.
  size: Mats to 2 m across; stems only a few cm above the substrate.
  zone_hint: >-
    Saline flats, back-beach, and the upper edge of coastal salt marsh.
    Not on active dune faces or bare sea-cliff rock.
  clinchers:
    - Prostrate succulent mat with fleshy opposite leaves — the whole plant is glossy and often flushed red.
    - Solitary pink-purple 5-lobed axillary flowers open in the sun (coloured sepals, no true petals).
    - Salt flat / back-beach habitat, not on dry cliff or bare sand dune.
  look_alikes:
    - species: Portulaca lutea (ʻihi)
      how_to_distinguish: >-
        ʻIhi has alternate cylindrical (terete) leaves and bright yellow
        flowers, versus ʻākulikuli kai's opposite flattened-oblong
        leaves and pink-purple flowers. The two often grow near each
        other on offshore islets.
    - species: Batis maritima (pickleweed, naturalized)
      how_to_distinguish: >-
        Batis has jointed, segmented stems with small paired scale-like
        leaves and tiny greenish cone-like inflorescences, not showy
        pink-purple flowers. Both share saline-flat habitat.
ecology: >-
  Extreme halophyte and pioneer of hypersaline substrates where few
  other flowering plants can grow. Its succulent tissues accumulate
  sodium and store fresh water, and its mats bind loose salt-flat
  sediment, initiating soil formation.
cultural_significance: >-
  The succulent stems and leaves have historically been eaten in coastal
  Hawaiian cuisine as a pot-herb; preparation belongs to Hawaiian food-
  culture practitioners and is not detailed here.
hazards: null

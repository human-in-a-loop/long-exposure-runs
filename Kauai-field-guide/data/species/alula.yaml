slug: alula
scientific_name: Brighamia insignis
authority: A. Gray
family: Campanulaceae
common_names:
  hawaiian: [ʻālula, ʻōlulu, pua ʻala]
  english: ["cabbage on a stick", vulcan palm]
status: endemic
conservation_status: "US Endangered (USFWS 1994; 2022 5-Year Review confirms no known wild individuals, new 5-year review initiated September 2025); IUCN Extinct in the Wild (assessment updated 2023)"
coastal_zones: [sea_cliff]
tier: rare_exotic
occurrence_notes: >-
  Endemic to sea cliffs of Kauaʻi and (formerly) Niʻihau. Historically
  present on the Nā Pali cliffs; wild plants are now vanishingly rare
  and the species is effectively extinct in the wild. Only observable in
  situ from offshore near Kalalau, Honopū, and Nuʻalolo Kai (and often
  not at all); commonly encountered ex situ in botanical gardens and
  restoration plantings on Kauaʻi.
how_to_identify:
  growth_form: >-
    A striking succulent-stemmed cliff plant with a single, thick, upright
    stem swollen at the base — resembling a bowling pin — topped with a
    dense terminal rosette of thick fleshy leaves. The whole silhouette
    reads as "a cabbage stuck on a club."
  leaves: >-
    Thick, fleshy, spatulate to obovate, 10–20 cm long, pale green with a
    slightly glossy surface, clustered tightly in the terminal rosette.
    Older leaves fall to leave leaf-scar rings on the stem.
  flowers: >-
    Long-tubed, cream to pale yellow, 6–14 cm long, fragrant at night, in
    axillary clusters at the top of the stem — historically pollinated by
    a native Hawaiian hawkmoth now presumed extinct, which is why in situ
    fruit-set collapsed and hand-pollination sustains the species today.
  fruit: >-
    A capsule containing many small seeds.
  bark_stem: >-
    Pale grey-green, smooth, thick and succulent; ringed with leaf scars
    from previous rosettes.
  size: 1–5 m tall.
  zone_hint: >-
    Nearly vertical sea-cliff faces of the north-west Kauaʻi coast, on
    ledges above ~50 m elevation. Never on the beach or in valley bottoms.
  clinchers:
    - The "cabbage on a stick" silhouette — a single swollen stem with a terminal leaf rosette.
    - Long tubular pale-yellow flowers in the rosette axils.
    - Grows on vertical or near-vertical Nā Pali sea cliffs — habitat alone almost identifies it.
    - Endemic to Kauaʻi–Niʻihau; if you are elsewhere, it is not Brighamia insignis wild.
  look_alikes:
    - species: Brighamia rockii
      how_to_distinguish: >-
        The sister species, endemic to sea cliffs of Molokaʻi and Maui-Nui
        (not Kauaʻi); flowers pure white rather than cream-yellow, corolla
        with narrower lobes. Off-island geography settles it.
    - species: Cultivated succulents / Cabbage tree (Cordyline)
      how_to_distinguish: >-
        Cordyline (kī / tī plant) is a soft-tissue shrub of forest understorey
        with strap leaves and unswollen stem; not remotely a cliff succulent.
ecology: >-
  Long-lived cliff endemic dependent on its now-vanished specialist
  hawkmoth pollinator. Documented population declines and the extreme
  scarcity of natural recruitment led to intensive rope-access hand-
  pollination programs and to comprehensive ex situ collections
  (National Tropical Botanical Garden and international botanical
  gardens) that now hold most of the world's living ʻālula.
cultural_significance: >-
  ʻĀlula is a signature endemic of the Nā Pali coast and a symbol of
  Kauaʻi's cliff botany in both cultural and scientific writing. Its
  decline is a working example, cited in Hawaiian conservation
  discussions, of what "endangered" means when the pollinator disappears.
hazards: >-
  Federally listed — do not approach or handle in the wild. Never attempt
  to reach a plant on a cliff face. Cliff exposure is the primary hazard
  to people; disturbance is the primary hazard to the plant.
uncertainty: >-
  Recent survey work has documented very few remaining wild individuals on
  the Nā Pali cliffs; some accounts describe the species as extinct in the
  wild. The IUCN and USFWS statuses are updated periodically — treat any
  claim of a wild population conservatively.

slug: akiaki
scientific_name: Sporobolus virginicus
authority: (L.) Kunth
family: Poaceae
common_names:
  hawaiian: [ʻakiʻaki]
  english: [seashore rush grass, coastal dropseed]
status: indigenous
conservation_status: null
coastal_zones: [strand, dune]
tier: common
occurrence_notes: >-
  Dense low-mat grass on beach flats and dune faces along all major
  Nā Pali beaches; particularly conspicuous where surface sand is stable.
how_to_identify:
  growth_form: >-
    Wiry, mat-forming, stoloniferous perennial grass, 10–40 cm tall,
    spreading by underground rhizomes and above-ground runners to form
    continuous turf.
  leaves: >-
    Stiff, narrow (2–4 mm wide), rolled inward, sharply pointed, ranked in
    two rows along the wiry stems; often silvery-blue when dry.
  flowers: >-
    Narrow, spike-like panicle 3–8 cm long, straw-colored to purplish, at
    the tip of each culm; individual florets tiny.
  fruit: >-
    Small grain that drops readily from the ripe panicle (whence "dropseed").
  bark_stem: Stems wiry, hard, greenish-grey.
  size: A mat, generally under knee height.
  zone_hint: >-
    Bare sand of the upper strand, dune faces, and salt-splash zones on
    low rocky headlands. Often intermixed with pōhuehue runners.
  clinchers:
    - Low mat-forming grass with wiry, sharply pointed leaves in two neat ranks.
    - Runs by tough surface stolons across bare sand.
    - Narrow spike-like panicle (not a bushy plume like fountain grass).
  look_alikes:
    - species: Cenchrus ciliaris (buffelgrass, invasive)
      how_to_distinguish: >-
        Coarser, tussock-forming, with dense bristly spikelet clusters; not a
        low creeping mat.
    - species: Cynodon dactylon (Bermuda grass)
      how_to_distinguish: >-
        Also mat-forming, but its inflorescence is a hand-shaped cluster of
        3–7 finger-like spikes at the culm tip, not a single narrow spike.
ecology: >-
  Salt- and drought-tolerant halophyte; a foundational sand binder that
  stabilizes dune surfaces and reduces wind erosion after storms. Provides
  cover for shorebirds and native insect fauna.
cultural_significance: >-
  ʻAkiʻaki is a familiar element of Hawaiian beach songs and place-names;
  it is respected as part of the shoreline pili (companion) grasses.
hazards: null

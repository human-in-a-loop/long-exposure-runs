<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 260" role="img" aria-label="Cross-section of the unpopulated Kauai coast — strand, dune, sea cliff, valley mouth, riparian"><defs><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c9e0f0"/><stop offset="1" stop-color="#eef7ff"/></linearGradient><linearGradient id="sea" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3a7ba0"/><stop offset="1" stop-color="#1b4b70"/></linearGradient></defs><rect x="0" y="0" width="700" height="260" fill="url(#sky)"/><rect x="0" y="180" width="200" height="80" fill="url(#sea)"/><!-- strand + dune --><path d="M0 210 C60 195 120 190 200 190 L200 260 L0 260 Z" fill="#f0e4c4"/><path d="M180 190 C220 175 270 175 300 195 L300 260 L180 260 Z" fill="#e6d29a"/><!-- valley mouth flat behind dune --><path d="M280 195 L440 205 L440 260 L280 260 Z" fill="#7a8a4a"/><!-- stream --><path d="M420 200 C430 220 430 240 440 260 L455 260 C445 240 442 220 435 200 Z" fill="#4a7a9a"/><!-- sea cliff rising to right --><path d="M440 205 L520 90 L560 60 L620 40 L700 30 L700 260 L440 260 Z" fill="#8a6a4a"/><path d="M520 90 L560 60 L620 40 L700 30 L700 90 Z" fill="#6a5a3a"/><!-- vegetation dots on cliff --><g fill="#3f6a2a"><circle cx="470" cy="185" r="4"/><circle cx="490" cy="160" r="4"/><circle cx="510" cy="130" r="4"/><circle cx="540" cy="100" r="4"/><circle cx="570" cy="80" r="4"/><circle cx="610" cy="60" r="4"/><circle cx="650" cy="45" r="4"/></g><!-- labels --><g font-family="sans-serif" font-size="12" fill="#1a1a1a"><text x="30" y="150">Strand</text><text x="30" y="164" font-size="10" fill="#55605a">wrack line, salt spray</text><text x="215" y="155">Dune</text><text x="215" y="169" font-size="10" fill="#55605a">stabilized sand</text><text x="325" y="165">Valley mouth</text><text x="325" y="179" font-size="10" fill="#55605a">brackish, wind-sheltered</text><text x="415" y="125">Riparian</text><text x="415" y="139" font-size="10" fill="#55605a">stream corridor</text><text x="540" y="140">Sea cliff (pali)</text><text x="540" y="154" font-size="10" fill="#55605a">endemic refugia</text></g><line x1="200" y1="188" x2="200" y2="220" stroke="#333" stroke-dasharray="3 3"/><line x1="300" y1="200" x2="300" y2="230" stroke="#333" stroke-dasharray="3 3"/><line x1="440" y1="205" x2="440" y2="235" stroke="#333" stroke-dasharray="3 3"/></svg>

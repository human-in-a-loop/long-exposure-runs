<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 844 468" role="img" aria-label="Layout: Side wall B + Ceiling strips">
<defs><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" class="hatchbg" fill="#EFE3C8"/><line x1="0" y1="0" x2="0" y2="8" class="hatchline"/></pattern></defs>
<style>

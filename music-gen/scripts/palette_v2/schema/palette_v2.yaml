$id: https://music-gen/palette/palette_v2
$schema: https://json-schema.org/draft/2020-12/schema
additionalProperties: false
description: "Peer schema (cycle 34 Branch A) that extends v1 with a discriminated\
  \ union on pinned_state.format \u2208 {v1_flat, v2_iterated_params}. v1_flat is\
  \ backwards-compatible with c31 palette_v1; v2_iterated_params carries the P1 (get_parameter(i)-iterate)\
  \ format uncovered by c33 Branch B, unblocking Surge XT + Dexed as palette-render-eligible\
  \ instruments. assignment_id_v2 uses a NEW UUID5 namespace (063eb50e-0aac-59bb-84a8-ef26540a8912)\
  \ distinct from v1's. additionalProperties: false at every object level."
properties:
  assignment_id_v2:
    description: UUID5 hex (32 lowercase hex chars) derived from canonical-JSON of
      (schema_v, stem, instrument, pinned_state, sorted(provenance_pointers), extractor_version)
      under NAMESPACE_PALETTE_V2 = uuid5(NAMESPACE_URL, 'palette_v2::music-gen::c34')
      = 063eb50e-0aac-59bb-84a8-ef26540a8912. notes_optional is EXCLUDED from the
      hash.
    pattern: ^[0-9a-f]{32}$
    type: string
  extractor_version:
    const: palette_v2_c34
  instrument:
    description: Instrument palette identifier. surge_xt/dexed = VST3; sfizz = SFZ
      sampler; fluidsynth_gm = legacy GM soundfont chain.
    enum:
    - surge_xt
    - dexed
    - sfizz
    - fluidsynth_gm
  notes_optional:
    description: Free-text authoring note. EXCLUDED from assignment_id_v2 hash.
    maxLength: 500
    type: string
  pinned_state:
    oneOf:
    - additionalProperties: false
      properties:
        external_state_sha_optional:
          pattern: ^[0-9a-f]{64}$
          type: string
        format:
          const: v1_flat
        parameter_dict:
          additionalProperties: false
          patternProperties:
            ^[a-zA-Z0-9_/. -]+$:
              type:
              - number
              - string
              - boolean
          type: object
        plugin_name:
          minLength: 1
          type: string
        plugin_version:
          minLength: 1
          type: string
        preset_name_optional:
          minLength: 1
          type: string
      required:
      - format
      - plugin_name
      - plugin_version
      - parameter_dict
      type: object
    - additionalProperties: false
      properties:
        format:
          const: v2_iterated_params
        iterated_params:
          additionalProperties: false
          description: 'Strict key set: keys derived from the plugin''s get_parameter_name(i)
            output, formatted as ''<5-digit-index>:<name>''. Layer 2 enforces exact
            equality with the c33 P1-output anchor for plugin_name.'
          patternProperties:
            ^[0-9]{5}:.+$:
              type:
              - number
              - integer
          type: object
        iteration_sha_256:
          description: SHA-256 of canonical_json(iterated_params) (sort_keys=True,
            separators=(',',':'), ensure_ascii=True).
          pattern: ^[0-9a-f]{64}$
          type: string
        iteration_size:
          minimum: 1
          type: integer
        plugin_name:
          minLength: 1
          type: string
        plugin_version:
          minLength: 1
          type: string
      required:
      - format
      - plugin_name
      - plugin_version
      - iterated_params
      - iteration_size
      - iteration_sha_256
      type: object
    properties:
      format:
        enum:
        - v1_flat
        - v2_iterated_params
    required:
    - format
    type: object
  provenance_pointers:
    items:
      description: rule_id string that MUST resolve against data/rules/ledger.jsonl
        OR data/rules/ledger_i3_dminor.jsonl (Layer 2 enforced).
      pattern: ^rule_[0-9a-f]{16}$
      type: string
    minItems: 1
    type: array
  schema_v:
    const: palette_v2
  stem:
    description: "Which stem this assignment addresses. 'mono' is NEW in v2 \u2014\
      \ enables VST3 instruments to serve as full-range assignments without per-stem\
      \ role."
    enum:
    - drums
    - bass
    - other
    - mono
required:
- schema_v
- assignment_id_v2
- stem
- instrument
- pinned_state
- provenance_pointers
- extractor_version
title: Palette assignment (v2)
type: object

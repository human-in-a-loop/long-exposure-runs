# M-CLASS-1 project taxonomy → AudioSet-527 mapping table.
#
# Project taxonomy is FIXED by the campaign prompt:
#   SPEECH, APPLAUSE, AMBIENT, MUSIC_LIVE, MUSIC_RECORDED
#
# All AudioSet class ids (mid) below were verified against
# `/root/panns_data/class_labels_indices.csv` (the CSV shipped with
# panns_inference; matches the AudioSet ontology PANNs trained on).
# See `stale/find_mids.py` for the discovery script.
#
# AudioSet does NOT have a native "Live music" leaf in the 527-class set.
# MUSIC_LIVE is therefore a COMPOSITE decision: music mass + audience-cue
# mass (Applause / Cheering / Clapping / Cheering / Crowd / Hands).
# See composite_rules below.

version: 2

direct_map:
  # ---------- SPEECH ----------
  SPEECH:
    - {mid: "/m/09x0r",   name: "Speech"}
    - {mid: "/m/05zppz",  name: "Male speech, man speaking"}
    - {mid: "/m/02zsn",   name: "Female speech, woman speaking"}
    - {mid: "/m/0ytgt",   name: "Child speech, kid speaking"}
    - {mid: "/m/01h8n0",  name: "Conversation"}
    - {mid: "/m/02qldy",  name: "Narration, monologue"}
    - {mid: "/m/0brhx",   name: "Speech synthesizer"}
    - {mid: "/m/02rtxlg", name: "Whispering"}

  # ---------- APPLAUSE (audience cues) ----------
  APPLAUSE:
    - {mid: "/m/028ght",  name: "Applause"}
    - {mid: "/m/0l15bq",  name: "Clapping"}
    - {mid: "/m/053hz1",  name: "Cheering"}

  # ---------- AMBIENT ----------
  AMBIENT:
    - {mid: "/m/03m9d0z", name: "Wind"}
    - {mid: "/m/06mb1",   name: "Rain"}
    - {mid: "/m/05kq4",   name: "Ocean"}
    - {mid: "/m/034srq",  name: "Waves, surf"}
    - {mid: "/m/0jb2l",   name: "Thunderstorm"}
    - {mid: "/m/09xqv",   name: "Cricket"}
    - {mid: "/m/0838f",   name: "Water"}
    - {mid: "/m/028v0c",  name: "Silence"}
    - {mid: "/m/09t49",   name: "Rustling leaves"}
    - {mid: "/m/0j2kx",   name: "Waterfall"}
    - {mid: "/t/dd00038", name: "Rain on surface"}
    - {mid: "/m/06wzb",   name: "Steam"}
    - {mid: "/m/0j6m2",   name: "Stream"}

  # ---------- MUSIC (umbrella; split into LIVE/RECORDED by composite rule)
  MUSIC:
    - {mid: "/m/04rlf",   name: "Music"}
    - {mid: "/m/04szw",   name: "Musical instrument"}
    - {mid: "/m/0342h",   name: "Guitar"}
    - {mid: "/m/018vs",   name: "Bass guitar"}
    - {mid: "/m/02sgy",   name: "Electric guitar"}
    - {mid: "/m/05r5c",   name: "Piano"}
    - {mid: "/m/05148p4", name: "Keyboard (musical)"}
    - {mid: "/m/01s0ps",  name: "Electric piano"}
    - {mid: "/m/0l14qv",  name: "Synthesizer"}
    - {mid: "/m/013y1f",  name: "Organ"}
    - {mid: "/m/02hnl",   name: "Drum kit"}
    - {mid: "/m/026t6",   name: "Drum"}
    - {mid: "/m/0l14md",  name: "Percussion"}
    - {mid: "/m/06rvn",   name: "Snare drum"}
    - {mid: "/m/01qbl",   name: "Cymbal"}
    - {mid: "/m/07y_7",   name: "Violin, fiddle"}
    - {mid: "/m/0l14_3",  name: "Bowed string instrument"}
    - {mid: "/m/0fx80y",  name: "Plucked string instrument"}
    - {mid: "/m/07xzm",   name: "Ukulele"}
    - {mid: "/m/085jw",   name: "Wind instrument, woodwind instrument"}
    - {mid: "/m/07gql",   name: "Trumpet"}
    - {mid: "/m/07c6l",   name: "Trombone"}
    - {mid: "/m/01kcd",   name: "Brass instrument"}
    - {mid: "/m/01wy6",   name: "Clarinet"}
    - {mid: "/m/0l14j_",  name: "Flute"}
    - {mid: "/m/06ncr",   name: "Saxophone"}
    - {mid: "/m/03m5k",   name: "Harp"}
    - {mid: "/m/02qmj0d", name: "String section"}
    - {mid: "/m/015lz1",  name: "Singing"}
    - {mid: "/m/0l14jd",  name: "Choir"}
    - {mid: "/m/05lls",   name: "Opera"}
    - {mid: "/m/0z9c",    name: "A capella"}

  # ---------- Live-music cues (subset of audience cues + Crowd/Hands) ----------
  # No "Live music" leaf in AudioSet-527, so we use crowd/hands as extra
  # live-cue mass beyond the APPLAUSE bucket.
  LIVE_MUSIC_LEAF:
    - {mid: "/m/03qtwd",  name: "Crowd"}
    - {mid: "/m/0k65p",   name: "Hands"}
    - {mid: "/m/07rkbfh", name: "Chatter"}

# MUSIC_LIVE composite rule:
#   verdict = MUSIC_LIVE if
#     MUSIC_mass >= music_min
#     AND (APPLAUSE_mass >= applause_min OR LIVE_LEAF_mass >= live_leaf_min)
composite_rules:
  music_min: 0.20
  applause_min: 0.15
  live_leaf_min: 0.30

# Ambiguity band: if music mass is between these bounds, flag `low_confidence`.
low_confidence_music_band: [0.05, 0.20]
